name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          fetch-depth: 0

      - name: Scan committed changes for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          # Normal push/PR runs use the action's diff detection. A manual run
          # supplies only head, which is TruffleHog's documented full-branch mode.
          head: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
          extra_args: --results=verified,unknown --fail-on-scan-errors
