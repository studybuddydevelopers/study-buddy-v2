name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0

      - name: Scan committed changes for secrets
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2 # v3.99.7
        with:
          # Normal push/PR runs use the action's diff detection. A manual run
          # supplies only head, which is TruffleHog's documented full-branch
          # mode. Full history contains reviewed, unverified Postgres patterns
          # from credentials that were already rotated; manual evidence blocks
          # on verified results while every new diff still blocks unknown ones.
          head: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
          extra_args: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            '--results=verified --fail-on-scan-errors' ||
            '--results=verified,unknown --fail-on-scan-errors' }}
