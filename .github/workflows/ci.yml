name: CI

on:
  pull_request:
    branches:
      - main
      - staging
      - docs/testing-baseline-and-roadmap
  push:
    branches:
      - main
      - staging
      - docs/testing-baseline-and-roadmap
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-ci:
    name: Full CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('package-lock.json') }}-

      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Install locked dependencies
        run: npm ci

      - name: Verify Node runtime contract
        id: runtime
        run: npm run verify:node-runtime

      - name: Audit dependencies
        run: npm run security:audit-dependencies

      - name: Lint
        run: npm run lint

      - name: Generate Next.js types
        run: npx --no-install next typegen

      - name: Type-check
        run: npx --no-install tsc --noEmit --pretty false

      - name: Check test policy
        id: test_policy
        run: npm run test:policy -- --json=output/test-results/test-policy.json

      - name: Run application tests with coverage
        id: coverage
        run: npm run test:coverage

      - name: Run script tests
        id: node_scripts
        run: |
          mkdir -p output/test-results
          node --test --test-reporter=junit scripts/*.test.mjs | tee output/test-results/node-scripts.xml

      - name: Install accessibility test browsers
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Run isolated accessibility browser tests
        id: browser
        run: npm run test:browser

      - name: Build production application
        id: build
        run: |
          mkdir -p output/test-results
          npm run build | tee output/test-results/build.log

      - name: Write CI evidence manifest
        if: ${{ always() }}
        env:
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          TEST_POLICY_OUTCOME: ${{ steps.test_policy.outcome }}
          COVERAGE_OUTCOME: ${{ steps.coverage.outcome }}
          NODE_SCRIPTS_OUTCOME: ${{ steps.node_scripts.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          node scripts/write-ci-evidence.mjs
          cat output/test-results/ci-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/
            output/test-results/
            output/playwright/results/
            output/playwright/report/
            output/playwright/results.json
          if-no-files-found: warn
          retention-days: 14

  real-next-e2e:
    name: Real Next.js E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector@sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e-only-password-not-a-secret-12345
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_DATABASE_URL: postgresql://postgres:e2e-only-password-not-a-secret-12345@127.0.0.1:5432/studybuddy_e2e
      DATABASE_URL: postgresql://postgres:e2e-only-password-not-a-secret-12345@127.0.0.1:5432/studybuddy_e2e
      DIRECT_URL: postgresql://postgres:e2e-only-password-not-a-secret-12345@127.0.0.1:5432/studybuddy_e2e
      APP_ORIGIN: http://127.0.0.1:3200
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:3200
      STUDY_BUDDY_E2E_TEST_MODE: "true"
      SUPABASE_URL: http://127.0.0.1:55431
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_test_only
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_test_only
      NEXT_PUBLIC_CAPTCHA_ENABLED: "false"
      RATE_LIMIT_HASH_SECRET: e2e-only-hash-secret-at-least-32-bytes-long
      TRUSTED_PROXY_PROVIDER: direct
      SECURITY_AUDIT_DB_ENABLED: "false"
      AI_CHAT_PROVIDER: fake
      AI_EMBEDDING_PROVIDER: fake

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Prepare disposable database
        run: npm run test:e2e:prepare

      - name: Build production application
        run: npm run build

      - name: Run real Next.js browser journeys
        run: npm run test:e2e

      - name: Upload real E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: real-next-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright-e2e/
          if-no-files-found: warn
          retention-days: 14
